<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f6fa">
<title>DSA </title>
<style>
:root {
  color-scheme:light;
  --bg:#f7f7fb; --sidebar:#eff0fa; --hover:#e6e9fb;
  --border:#e5e5ee; --text:#282b40; --muted:#7b7f96; --line:#dedfea;
}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.sidebar{width:256px;height:100vh;flex:0 0 256px;background:linear-gradient(180deg,#eff0fb 0%,#f3f4fa 100%);padding:18px 10px 35px;overflow-y:auto;scrollbar-width:none;transition:width .2s ease,padding .2s ease}
.sidebar::-webkit-scrollbar,.content::-webkit-scrollbar{display:none}
.sidebar-toggle{position:fixed;z-index:10;top:18px;left:244px;width:24px;height:24px;border:1px solid var(--border);border-radius:50%;background:#fff;color:var(--text);cursor:pointer;font-size:17px;line-height:1;transition:left .2s ease,background .15s ease}
.sidebar-toggle:hover{background:#e8e8f4}
.sidebar-toggle:focus-visible{outline:2px solid #9699b4;outline-offset:2px}
.sidebar-hidden .sidebar{display:none}
.sidebar-hidden .sidebar-toggle{left:10px}
.sidebar-hidden .sidebar-toggle .toggle-icon{display:inline-block;transform:rotate(180deg)}
.header{padding:5px 13px 15px;border-bottom:1px solid #dfe1f0;margin-bottom:12px}
.title{font-size:18px;font-weight:800;letter-spacing:.1px;color:#343955}
.nav-label{padding:4px 13px 7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.1px}
.topic>summary,.pattern>summary{list-style:none;cursor:pointer;user-select:none}
.topic>summary::-webkit-details-marker,.pattern>summary::-webkit-details-marker{display:none}
.topic>summary{padding:9px 10px;border-left:3px solid transparent;border-radius:8px;font-size:13px;font-weight:750;transition:background .15s ease,color .15s ease,border-color .15s ease}
.topic>summary:hover,.pattern>summary:hover{background:var(--hover)}
.topic[open]>summary{background:#e5e8fb;border-left-color:#777fd0;color:#343b66}
.chevron{display:inline-block;width:6px;height:6px;border-right:1.7px solid #777b91;border-bottom:1.7px solid #777b91;transform:rotate(-45deg);margin:0 10px 2px 2px;transition:.15s}
details[open]>summary .chevron{transform:rotate(45deg);margin-bottom:5px}
.patterns{margin-left:13px;border-left:1px solid var(--line);padding-left:5px}
.pattern>summary{padding:8px 8px 8px 10px;color:#555a72;font-size:12px;font-weight:650}
.pattern[open]>summary{color:#426b60;background:#e3f2eb;border-radius:7px}
.pattern .chevron{width:5px;height:5px;margin-right:8px;border-color:#8589a0}
.questions{padding:2px 0 7px 7px}
.question{display:flex;align-items:flex-start;gap:8px;padding:6px 7px;border-radius:8px;color:#5e6278;text-decoration:none;font-size:12px;line-height:1.35}
.question:hover{background:#e8e8f4;color:#292d42}
.question.active{background:#e2e4fb;color:#292d42;box-shadow:inset 3px 0 #777fd0}
.number{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#82869b;min-width:20px;text-align:right;padding-top:2px}
.doc{width:9px;height:11px;border:1px solid #85899d;border-radius:1.5px;position:relative;flex:none;margin-top:1px}
.doc:after{content:"";position:absolute;left:2px;right:2px;top:3px;height:1px;background:#85899d;box-shadow:0 2px #85899d,0 4px #85899d}
.layout{display:flex;height:100vh;overflow:hidden}
.content{flex:1;min-width:0;width:100%;height:100vh;padding:34px 40px;max-width:865px;overflow-y:auto;scrollbar-width:none}
.question-card{scroll-margin-top:20px;margin:0 0 42px}
.question-heading{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.question-heading h1{font-size:25px;line-height:1.2;margin:0;letter-spacing:-.4px;overflow-wrap:anywhere}
.q-number{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;background:#25283d;color:white;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.pattern-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #e8e8f0;border-radius:999px;background:#fff;color:#666b80;font-size:11px;line-height:1}
.section{border:0;border-radius:19px;margin:10px 0;background:#fff;overflow:hidden;padding:8px}
.section-title{padding:8px 12px;font-size:13px;font-weight:750;color:#41455c}
.section-dropdown>summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700}
.section-dropdown>summary::-webkit-details-marker{display:none}
.section-dropdown>summary:before{content:"+";display:inline-block;width:18px;color:#999;font-size:18px}
.section-dropdown[open]>summary:before{content:"−"}
.section-body{border-radius:13px;background:#fff;padding:15px 18px;color:#555a70;font-size:14px;line-height:1.65;overflow-x:auto;overflow-y:hidden}
.section-body p{margin:0 0 12px}.section-body p:last-child{margin-bottom:0}
.section-body ul,.section-body ol{margin:7px 0 12px;padding-left:24px}
.section-body pre{background:#f6f6fa;border:1px solid #e8e8f0;border-radius:9px;padding:14px;overflow:auto;line-height:1.5}
.section-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#4f536e;background:#eeeefa;border-radius:4px;padding:1px 4px}
.section-body pre code{color:#33374e;background:transparent;padding:0}
.section-body blockquote{border-left:3px solid #b5b8d8;margin:12px 0;padding-left:14px;color:#656a81;font-style:italic}
.problem-section{background:#e4e5fb}
.problem-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.problem-statement,.problem-detail{grid-column:1/-1}
.problem-statement{padding:14px 18px 12px}
.problem-statement-label{margin-bottom:7px;color:#8589a0;font-size:10px;font-weight:800;letter-spacing:.8px}
.problem-example{background:#ffe5d4}
.problem-example.example-even{background:#d9f3e8}
.problem-example .section-body,.problem-detail .section-body{padding:13px 16px}
.problem-example pre,.problem-detail pre{background:#fff;border-color:#fff;margin-top:8px}
.problem-example .section-title,.problem-detail .section-title{padding:8px 12px}
.problem-detail{background:#dcecff}
.problem-extra{grid-column:1/-1;background:#ececf6}
.problem-extra .section-body{padding:13px 16px}
.content-section:nth-of-type(2){background:#e9e7fb}
.content-section:nth-of-type(3){background:#e0efff}
.content-section:nth-of-type(4){background:#e9eaf0}
.content-section:nth-of-type(5){background:#e0f3e9}
.content-section:nth-of-type(6){background:#fff0d9}
.section-dropdown{background:#ececf6}
.question:focus-visible,.pattern>summary:focus-visible,.topic>summary:focus-visible{outline:2px solid #9a9dc4;outline-offset:2px}
@media(max-width:700px){
  .layout{display:block;height:auto;min-height:100svh;overflow:visible}
  .sidebar{width:100%;height:auto;flex:none;min-height:auto;border-bottom:1px solid var(--border);max-height:45svh;padding:12px 8px 20px}
  .sidebar-toggle{top:12px;left:auto;right:12px}
  .sidebar-hidden .sidebar{width:100%;max-height:0;padding-top:0;padding-bottom:0;border-bottom-color:transparent}
  .sidebar-hidden .sidebar-toggle{left:auto;right:12px}
  .header{padding:8px 12px 14px}
  .topic>summary{padding:12px}
  .pattern>summary{padding:11px 10px 11px 13px}
  .question{min-height:40px;padding:10px 8px;font-size:14px}
  .content{height:auto;overflow:visible;padding:25px 16px 40px;max-width:none}
  .question-card{margin-bottom:24px}
  .question-heading{gap:8px}
  .question-heading h1{font-size:22px}
  .q-number{width:34px;height:34px}
  .pattern-badge{font-size:10px;padding:5px 8px}
  .problem-layout{grid-template-columns:minmax(0,1fr)}
  .section-title,.section-dropdown>summary{padding:14px}
  .section-body{padding:14px;font-size:16px}
  .section-body pre{max-width:100%;font-size:14px}
}
@media(max-width:360px){
  .content{padding-left:9px;padding-right:9px}
  .question-heading h1{font-size:20px}
  .section-body{padding:12px;font-size:15px}
}
</style>
</head>

const questionByDisplayNumber = new Map();

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

function renderMarkdown(markdown) {
  const lines = markdown.split(/\r?\n/);
  const output = [];
  let inCode = false;
  let code = [];
  let listType = null;
  const closeList = () => {
    if (listType) { output.push(`</${listType}>`); listType = null; }
  };
  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      if (inCode) { output.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`); code = []; }
      inCode = !inCode;
      continue;
    }
    if (inCode) { code.push(line); continue; }
    const heading = line.match(/^\s*(#{1,6})\s+(.+)$/);
    if (heading) {
      closeList();
      const level = Math.min(heading[1].length + 1, 6);
      output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
      continue;
    }
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+\.\s+(.*)$/);
    if (bullet || numbered) {
      const type = bullet ? "ul" : "ol";
      if (listType !== type) { closeList(); output.push(`<${type}>`); listType = type; }
      output.push(`<li>${inlineMarkdown((bullet || numbered)[1])}</li>`);
      continue;
    }
    closeList();
    if (!line.trim()) continue;
    if (line.startsWith(">")) output.push(`<blockquote>${inlineMarkdown(line.slice(1).trim())}</blockquote>`);
    else output.push(`<p>${inlineMarkdown(line)}</p>`);
  }
  closeList();
  if (inCode) output.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
  return output.join("");
}

function inlineMarkdown(value) {
  return escapeHtml(value)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function renderProblemContent(markdown) {
  const constraintMatch = markdown.match(
    /^\*\*Important (?:constraint|assumption)(?:\s*\/\s*assumption)?:\*\*\s*(.+)$/im
  );
  if (constraintMatch) {
    markdown = markdown.replace(constraintMatch[0], "").replace(/^\s*---\s*$/gm, "");
  }
  const blocks = [];
  let current = { title: "", lines: [] };
  for (const line of markdown.split(/\r?\n/)) {
    const heading = line.match(/^###\s+(.+)$/);
    if (heading) {
      blocks.push(current);
      current = { title: heading[1], lines: [] };
    } else {
      current.lines.push(line);
    }
  }
  blocks.push(current);

  const statementBlock = blocks.find((block) =>
    /^(?:short )?problem statement$/i.test(block.title)
  );
  const intro = blocks.find((block) => !block.title);
  const examples = blocks.filter((block) => /^example\b/i.test(block.title));
  const details = blocks.filter((block) =>
    block.title
    && !/^example\b/i.test(block.title)
    && block !== statementBlock
    && !/constraint|assumption/i.test(block.title)
  );
  const statement = [
    statementBlock && statementBlock.lines.join("\n").trim(),
    intro && intro.lines.join("\n").trim()
  ].filter(Boolean).join("\n\n");
  const constraintBlock = blocks.find((block) =>
    /constraint|assumption/i.test(block.title)
  );
  const constraint = constraintMatch
    ? constraintMatch[1].trim()
    : constraintBlock && constraintBlock.lines.join("\n").trim();
  const statementCard = statement
    ? `<div class="problem-statement section-body">
        <div class="problem-statement-label">SHORT PROBLEM STATEMENT</div>
        ${renderMarkdown(statement)}
      </div>`
    : "";
  const exampleCards = examples.map((example, index) =>
    `<section class="section problem-example${index % 2 ? " example-even" : ""}">
      <div class="section-title">${escapeHtml(example.title)}</div>
      <div class="section-body">${renderMarkdown(example.lines.join("\n").trim())}</div>
    </section>`
  ).join("");
  const constraintCard = constraint
    ? `<section class="section problem-detail">
      <div class="section-title">Important constraint / assumption</div>
      <div class="section-body">${renderMarkdown(constraint)}</div>
    </section>`
    : "";
  const detailCards = details.map((detail) =>
    `<section class="section problem-extra">
      <div class="section-title">${escapeHtml(detail.title)}</div>
      <div class="section-body">${renderMarkdown(detail.lines.join("\n").trim())}</div>
    </section>`
  ).join("");

  return `<div class="problem-layout">${statementCard}${exampleCards}${constraintCard}${detailCards}</div>`;
}

function showQuestion(number, title) {
  const question = questionByDisplayNumber.get(number);
  if (!question) {
    content.innerHTML = "";
    return;
  }
  const pattern = patternByTitle.get(normalizeTitle(question.title));
  content.innerHTML = `<article class="question-card" id="q-${number}">
    <header class="question-heading">
      <span class="q-number">${String(number).padStart(3, "0")}</span>
      <h1>${escapeHtml(question.title)}</h1>
      ${pattern ? `<span class="pattern-badge">${escapeHtml(pattern.pattern)}</span>` : ""}
    </header>
    ${question.sections.map((section, index) => {
      if (section.title === "Problem") {
        return `<section class="section problem-section">
          <div class="section-title">${escapeHtml(section.title)}</div>
          ${renderProblemContent(section.content)}
        </section>`;
      }
      const body = `<div class="section-body">${renderMarkdown(section.content)}</div>`;
      return section.title === "Optional Dry Run"
        ? `<details class="section section-dropdown content-section"><summary>${escapeHtml(section.title)}</summary>${body}</details>`
        : `<section class="section content-section"><div class="section-title">${escapeHtml(section.title)}</div>${body}</section>`;
    }).join("")}
  </article>`;
  document.querySelectorAll(".question.active").forEach((item) => item.classList.remove("active"));
  document.querySelector(`a.question[href="#q-${number}"]`)?.classList.add("active");
  history.replaceState(null, "", `#q-${number}`);
  if (window.matchMedia("(max-width: 700px)").matches) {
    content.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

for (const [topic, patterns] of Object.entries(orderedMaster)) {
  const availablePatterns = Object.entries(patterns).filter(([, questions]) =>
    questions.some((questionTitle) => questionByTitle.has(normalizeTitle(questionTitle)))
  );
  if (!availablePatterns.length) continue;

  const topicDetails = document.createElement("details");
  topicDetails.className = "topic";
  topicDetails.open = true;
  const topicSummary = document.createElement("summary");
  topicSummary.innerHTML = '<span class="chevron"></span>' + (topicLabels[topic] || topic);
  topicDetails.appendChild(topicSummary);
  const patternWrap = document.createElement("div");
  patternWrap.className = "patterns";
  for (const [pattern, questions] of availablePatterns) {
    const availableQuestions = questions.filter((questionTitle) =>
      questionByTitle.has(normalizeTitle(questionTitle))
    );
    if (!availableQuestions.length) continue;

    const patternDetails = document.createElement("details");
    patternDetails.className = "pattern";
    patternDetails.open = questionNumber === 0;
    const patternSummary = document.createElement("summary");
    patternSummary.innerHTML = '<span class="chevron"></span>' + pattern;
    patternDetails.appendChild(patternSummary);
    const questionWrap = document.createElement("div");
    questionWrap.className = "questions";
    for (const questionTitle of availableQuestions) {
      const question = questionByTitle.get(normalizeTitle(questionTitle));
      if (!question) continue;
      questionNumber++;
      const currentQuestionNumber = questionNumber;
      questionByDisplayNumber.set(currentQuestionNumber, question);
      const item = document.createElement("a");
      item.className = "question";
      item.href = "#q-" + currentQuestionNumber;
      item.innerHTML = `<span class="number">${String(currentQuestionNumber).padStart(3, "0")}</span><span class="doc"></span><span>${questionTitle}</span>`;
      item.addEventListener("click", (event) => { event.preventDefault(); showQuestion(currentQuestionNumber, questionTitle); });
      questionWrap.appendChild(item);
    }
    patternDetails.appendChild(questionWrap);
    patternWrap.appendChild(patternDetails);
  }
  topicDetails.appendChild(patternWrap);
  tree.appendChild(topicDetails);
}
sidebarToggle.addEventListener("click", () => {
  const isHidden = layout.classList.toggle("sidebar-hidden");
  sidebarToggle.setAttribute("aria-expanded", String(!isHidden));
  sidebarToggle.setAttribute("aria-label", isHidden ? "Show sidebar" : "Hide sidebar");
  sidebarToggle.title = isHidden ? "Show sidebar" : "Hide sidebar";
});

const requestedQuestionNumber = Number.parseInt(window.location.hash.replace("#q-", ""), 10);
const initialQuestionNumber = Number.isInteger(requestedQuestionNumber)
  && requestedQuestionNumber > 0
  && requestedQuestionNumber <= questionNumber
  ? requestedQuestionNumber
  : (questionNumber > 0 ? 1 : 0);
if (Number.isInteger(initialQuestionNumber) && initialQuestionNumber > 0 && initialQuestionNumber <= questionNumber) {
  const initialLink = document.querySelector(`a.question[href="#q-${initialQuestionNumber}"]`);
  if (initialLink) {
    initialLink.closest("details")?.setAttribute("open", "");
    initialLink.closest(".topic")?.setAttribute("open", "");
    showQuestion(initialQuestionNumber, initialLink.textContent.trim());
  }
}
</script>
