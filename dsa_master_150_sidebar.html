<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0d">
<title>DSA </title>
<style>
:root {
  --bg:#0b0b0d; --sidebar:#111113; --hover:#1a1a1d;
  --border:#29292d; --text:#f1f1f3; --muted:#a4a4ab; --line:#303035;
}
*{box-sizing:border-box}
html{background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.sidebar{width:360px;min-height:100vh;background:var(--sidebar);border-right:1px solid var(--border);padding:18px 10px 35px;overflow-y:auto}
.header{padding:8px 16px 20px;border-bottom:1px solid var(--border);margin-bottom:10px}
.title{font-size:20px;font-weight:800;letter-spacing:.2px}
.count{font-size:12px;color:var(--muted);margin-top:4px}
.topic>summary,.pattern>summary{list-style:none;cursor:pointer;user-select:none}
.topic>summary::-webkit-details-marker,.pattern>summary::-webkit-details-marker{display:none}
.topic>summary{padding:13px 14px;border-radius:9px;font-size:17px;font-weight:750}
.topic>summary:hover,.pattern>summary:hover{background:var(--hover)}
.chevron{display:inline-block;width:8px;height:8px;border-right:2px solid #999;border-bottom:2px solid #999;transform:rotate(-45deg);margin:0 12px 2px 2px;transition:.15s}
details[open]>summary .chevron{transform:rotate(45deg);margin-bottom:5px}
.patterns{margin-left:23px;border-left:1px solid var(--line);padding-left:7px}
.pattern>summary{padding:9px 10px 9px 15px;color:#c0c0c6;font-size:14px;font-weight:650}
.pattern .chevron{width:7px;height:7px;margin-right:9px;border-color:#777}
.questions{padding:2px 0 8px 22px}
.question{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;color:#aaaab1;text-decoration:none;font-size:13px;line-height:1.35}
.question:hover{background:#18181b;color:#eee}
.number{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666;min-width:25px;text-align:right}
.doc{width:14px;height:17px;border:1.3px solid #777;border-radius:2px;position:relative;flex:none}
.doc:after{content:"";position:absolute;left:3px;right:3px;top:5px;height:1px;background:#777;box-shadow:0 4px #777,0 8px #777}
.layout{display:flex;min-height:100vh}
.content{flex:1;min-width:0;width:100%;padding:34px clamp(20px,5vw,72px);max-width:1100px}
.question-card{scroll-margin-top:20px;margin:0 0 42px}
.question-card h2{font-size:27px;margin:0 0 16px;overflow-wrap:anywhere}
.question-card h2 .q-number{color:#777;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;margin-right:8px}
.section{border:1px solid var(--border);border-radius:9px;margin:10px 0;background:#111113;overflow:hidden}
.section-title{padding:14px 17px;font-weight:700;border-bottom:1px solid var(--border)}
.section-dropdown>summary{cursor:pointer;list-style:none;padding:14px 17px;font-weight:700}
.section-dropdown>summary::-webkit-details-marker{display:none}
.section-dropdown>summary:before{content:"+";display:inline-block;width:18px;color:#999;font-size:18px}
.section-dropdown[open]>summary:before{content:"−"}
.section-body{border-top:1px solid var(--border);padding:16px 19px;color:#d6d6da;line-height:1.6;overflow-x:auto;overflow-y:hidden}
.section-body p{margin:0 0 12px}.section-body p:last-child{margin-bottom:0}
.section-body ul,.section-body ol{margin:7px 0 12px;padding-left:24px}
.section-body pre{background:#0a0a0c;border:1px solid #25252a;border-radius:7px;padding:14px;overflow:auto;line-height:1.45}
.section-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f1c674}
.section-body pre code{color:#ddd}
.section-body blockquote{border-left:3px solid #777;margin:12px 0;padding-left:14px;color:#bbb;font-style:italic}
@media(max-width:700px){
  .layout{display:block;min-height:100svh}
  .sidebar{width:100%;min-height:auto;border-right:0;border-bottom:1px solid var(--border);max-height:45svh;padding:12px 8px 20px}
  .header{padding:8px 12px 14px}
  .topic>summary{padding:14px 12px}
  .pattern>summary{padding:12px 10px 12px 13px}
  .question{min-height:44px;padding:11px 8px;font-size:14px}
  .content{padding:24px 12px 40px;max-width:none}
  .question-card{margin-bottom:24px}
  .question-card h2{font-size:23px;line-height:1.25}
  .section-title,.section-dropdown>summary{padding:14px}
  .section-body{padding:14px;font-size:15px}
  .section-body pre{max-width:100%;font-size:13px}
}
@media(max-width:360px){
  .content{padding-left:9px;padding-right:9px}
  .question-card h2{font-size:21px}
  .section-body{padding:12px;font-size:14px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="header">
      <div class="title">DSA Revision </div>
      <div class="count">105 questions · pattern-wise</div>
    </div>
    <div id="tree"></div>
  </aside>
  <main class="content">
    <div id="content"></div>
  </main>
</div>
<script src="dsa_questions.js"></script>
<script>
const master = {"Arrays": {"Linear Scan & State Tracking": ["Move Zeroes", "Remove Duplicates from Sorted Array", "Best Time to Buy and Sell Stock", "Maximum Subarray (Kadane's Algorithm)", "Maximum Product Subarray", "Majority Element", "Missing Number", "Single Number", "Find the Duplicate Number"], "Prefix Sum": ["Range Sum Query - Immutable", "Subarray Sum Equals K", "Continuous Subarray Sum", "Product of Array Except Self"], "Hashing": ["Two Sum", "Longest Consecutive Sequence"], "Sorting & Partitioning": ["Sort Colors", "Rotate Array", "Next Permutation"]}, "Strings": {"Frequency & Hashing": ["Valid Anagram", "Group Anagrams", "Ransom Note", "First Unique Character in a String"], "Palindrome & String Processing": ["Valid Palindrome", "Longest Palindromic Substring", "Palindromic Substrings"], "String Design": ["Encode and Decode Strings"]}, "Two Pointers": {"Opposite Direction": ["Two Sum II - Input Array Is Sorted", "3Sum", "Container With Most Water", "Trapping Rain Water"], "Fast & Slow / In-Place": ["Squares of a Sorted Array"]}, "Sliding Window": {"Fixed Window": ["Find All Anagrams in a String", "Permutation in String"], "Variable Window": ["Longest Substring Without Repeating Characters", "Longest Repeating Character Replacement", "Minimum Size Subarray Sum", "Longest Subarray with Sum at Most K"], "Advanced Window": ["Minimum Window Substring", "Sliding Window Maximum"]}, "Stack & Monotonic Stack": {"Stack Basics": ["Valid Parentheses", "Min Stack", "Evaluate Reverse Polish Notation"], "Monotonic Stack": ["Daily Temperatures", "Next Greater Element I", "Next Greater Element II", "Largest Rectangle in Histogram", "Online Stock Span", "Asteroid Collision"]}, "Binary Search": {"Classic Binary Search": ["Binary Search", "Search Insert Position", "Find First and Last Position of Element in Sorted Array", "Search a 2D Matrix"], "Rotated Arrays": ["Search in Rotated Sorted Array", "Find Minimum in Rotated Sorted Array"], "Binary Search on Answer": ["Koko Eating Bananas", "Capacity to Ship Packages Within D Days", "Split Array Largest Sum", "Magnetic Force Between Two Balls"]}, "Linked List": {"Basic Pointer Manipulation": ["Reverse Linked List", "Merge Two Sorted Lists", "Linked List Cycle", "Middle of the Linked List"], "Two Pointer / Reordering": ["Remove Nth Node From End of List", "Reorder List", "Palindrome Linked List", "Intersection of Two Linked Lists"], "Advanced Linked List": ["Add Two Numbers", "Copy List with Random Pointer", "Merge K Sorted Lists", "LRU Cache"]}, "Trees": {"DFS Fundamentals": ["Maximum Depth of Binary Tree", "Same Tree", "Invert Binary Tree", "Symmetric Tree", "Path Sum", "Count Good Nodes in Binary Tree"], "BFS / Level Order": ["Binary Tree Level Order Traversal", "Binary Tree Right Side View", "Average of Levels in Binary Tree", "Minimum Depth of Binary Tree"], "BST": ["Validate Binary Search Tree", "Kth Smallest Element in a BST", "Lowest Common Ancestor of a Binary Search Tree", "Convert Sorted Array to Binary Search Tree"], "Tree DP / Advanced": ["Diameter of Binary Tree", "Balanced Binary Tree", "Lowest Common Ancestor of a Binary Tree", "Binary Tree Maximum Path Sum", "Serialize and Deserialize Binary Tree"]}, "Heap / Priority Queue": {"Top K & Selection": ["Kth Largest Element in an Array", "Top K Frequent Elements", "K Closest Points to Origin", "Kth Smallest Element in a Sorted Matrix"], "Two Heaps": ["Find Median from Data Stream", "Sliding Window Median"], "Heap Merge / Scheduling": ["Task Scheduler"]}, "Backtracking": {"Subsets & Permutations": ["Subsets", "Subsets II", "Permutations", "Permutations II"], "Combinations": ["Combination Sum", "Combination Sum II", "Letter Combinations of a Phone Number"], "Grid / Constraint Backtracking": ["Word Search", "N-Queens"]}, "Graphs": {"DFS / BFS": ["Number of Islands", "Clone Graph", "Max Area of Island", "Flood Fill", "Surrounded Regions", "Pacific Atlantic Water Flow", "Word Ladder"], "Topological Sort": ["Course Schedule", "Course Schedule II", "Alien Dictionary"], "Union Find": ["Number of Connected Components", "Graph Valid Tree", "Redundant Connection"], "Shortest Path": ["Network Delay Time", "Cheapest Flights Within K Stops", "Path With Minimum Effort"]}, "Dynamic Programming": {"1D DP": ["Climbing Stairs", "Min Cost Climbing Stairs", "House Robber", "House Robber II", "Decode Ways", "Word Break"], "Knapsack / Subset": ["Coin Change", "Coin Change II", "Partition Equal Subset Sum", "Target Sum"], "Grid DP": ["Unique Paths", "Unique Paths II", "Minimum Path Sum", "Triangle"], "Sequence DP": ["Longest Increasing Subsequence", "Longest Common Subsequence", "Edit Distance", "Distinct Subsequences"], "Advanced DP": ["Best Time to Buy and Sell Stock with Cooldown", "Longest Palindromic Subsequence"]}, "Greedy & Intervals": {"Greedy": ["Jump Game", "Jump Game II", "Gas Station", "Hand of Straights", "Partition Labels"], "Intervals": ["Merge Intervals", "Insert Interval", "Non-overlapping Intervals", "Meeting Rooms II"]}};
const tree = document.getElementById("tree");
const content = document.getElementById("content");
const count = document.querySelector(".count");
const normalizeTitle = (title) => title.toLowerCase().replace(/[^a-z0-9]/g, "");
const questionByTitle = new Map(questionContent.map((question) => [normalizeTitle(question.title), question]));
const questionByDisplayNumber = new Map();
let questionNumber = 0;

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[character]));
}

function renderMarkdown(markdown) {
  const lines = markdown.split(/\r?\n/);
  const output = [];
  let inCode = false;
  let code = [];
  let listType = null;
  const closeList = () => {
    if (listType) { output.push(`</${listType}>`); listType = null; }
  };
  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      if (inCode) { output.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`); code = []; }
      inCode = !inCode;
      continue;
    }
    if (inCode) { code.push(line); continue; }
    const heading = line.match(/^\s*(#{1,6})\s+(.+)$/);
    if (heading) {
      closeList();
      const level = Math.min(heading[1].length + 1, 6);
      output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
      continue;
    }
    const bullet = line.match(/^\s*[-*]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+\.\s+(.*)$/);
    if (bullet || numbered) {
      const type = bullet ? "ul" : "ol";
      if (listType !== type) { closeList(); output.push(`<${type}>`); listType = type; }
      output.push(`<li>${inlineMarkdown((bullet || numbered)[1])}</li>`);
      continue;
    }
    closeList();
    if (!line.trim()) continue;
    if (line.startsWith(">")) output.push(`<blockquote>${inlineMarkdown(line.slice(1).trim())}</blockquote>`);
    else output.push(`<p>${inlineMarkdown(line)}</p>`);
  }
  closeList();
  if (inCode) output.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
  return output.join("");
}

function inlineMarkdown(value) {
  return escapeHtml(value)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function showQuestion(number, title) {
  const question = questionByDisplayNumber.get(number);
  if (!question) {
    content.innerHTML = "";
    return;
  }
  content.innerHTML = `<article class="question-card" id="q-${number}">
    <h2><span class="q-number">#${String(number).padStart(3, "0")}</span>${escapeHtml(question.title)}</h2>
    ${question.sections.map((section) => {
      const body = `<div class="section-body">${renderMarkdown(section.content)}</div>`;
      return section.title === "Optional Dry Run"
        ? `<details class="section section-dropdown"><summary>${escapeHtml(section.title)}</summary>${body}</details>`
        : `<section class="section"><div class="section-title">${escapeHtml(section.title)}</div>${body}</section>`;
    }).join("")}
  </article>`;
  history.replaceState(null, "", `#q-${number}`);
    if (window.matchMedia("(max-width: 700px)").matches) {
      content.scrollIntoView({ behavior: "smooth", block: "start" });
    }
}

for (const [topic, patterns] of Object.entries(master)) {
  const availablePatterns = Object.entries(patterns).filter(([, questions]) =>
    questions.some((questionTitle) => questionByTitle.has(normalizeTitle(questionTitle)))
  );
  if (!availablePatterns.length) continue;

  const topicDetails = document.createElement("details");
  topicDetails.className = "topic";
  topicDetails.open = true;
  const topicSummary = document.createElement("summary");
  topicSummary.innerHTML = '<span class="chevron"></span>' + topic;
  topicDetails.appendChild(topicSummary);
  const patternWrap = document.createElement("div");
  patternWrap.className = "patterns";
  for (const [pattern, questions] of availablePatterns) {
    const availableQuestions = questions.filter((questionTitle) =>
      questionByTitle.has(normalizeTitle(questionTitle))
    );
    if (!availableQuestions.length) continue;

    const patternDetails = document.createElement("details");
    patternDetails.className = "pattern";
    const patternSummary = document.createElement("summary");
    patternSummary.innerHTML = '<span class="chevron"></span>' + pattern;
    patternDetails.appendChild(patternSummary);
    const questionWrap = document.createElement("div");
    questionWrap.className = "questions";
    for (const questionTitle of availableQuestions) {
      const question = questionByTitle.get(normalizeTitle(questionTitle));
      if (!question) continue;
      questionNumber++;
      const currentQuestionNumber = questionNumber;
      questionByDisplayNumber.set(currentQuestionNumber, question);
      const item = document.createElement("a");
      item.className = "question";
      item.href = "#q-" + currentQuestionNumber;
      item.innerHTML = `<span class="number">${String(currentQuestionNumber).padStart(3, "0")}</span><span class="doc"></span><span>${questionTitle}</span>`;
      item.addEventListener("click", (event) => { event.preventDefault(); showQuestion(currentQuestionNumber, questionTitle); });
      questionWrap.appendChild(item);
    }
    patternDetails.appendChild(questionWrap);
    patternWrap.appendChild(patternDetails);
  }
  topicDetails.appendChild(patternWrap);
  tree.appendChild(topicDetails);
}
count.textContent = `${questionNumber} answered questions · pattern-wise index`;

const initialQuestionNumber = Number.parseInt(window.location.hash.replace("#q-", ""), 10);
if (Number.isInteger(initialQuestionNumber) && initialQuestionNumber > 0 && initialQuestionNumber <= questionNumber) {
  const initialLink = document.querySelector(`a.question[href="#q-${initialQuestionNumber}"]`);
  if (initialLink) {
    initialLink.closest("details")?.setAttribute("open", "");
    initialLink.closest(".topic")?.setAttribute("open", "");
    showQuestion(initialQuestionNumber, initialLink.textContent.trim());
  }
}
</script>
</body>
</html>
